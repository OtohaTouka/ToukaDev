version: 2.1
jobs:
  test:
    docker:
      # 映像釘版本（uv 與 Python 和本機一致）；升級時一起改。
      - image: ghcr.io/astral-sh/uv:0.12.1-python3.12-trixie-slim
    steps:
      - checkout
      - run: uv sync --locked
      - run: uv run --locked pytest tests/ -v
      - run: uv run --locked ruff check .
      - run: uv run --locked python scripts/guard_all.py
workflows:
  main:
    jobs:
      - test
