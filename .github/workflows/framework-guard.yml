name: framework-guard

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run framework guard tests
        run: uv run --locked pytest tests
      - name: Run Ruff
        run: uv run --locked ruff check scripts tests project-init dev-workflow
      - name: Run framework consistency guard
        run: uv run --locked python scripts/guard_framework.py
